  <ellipse cx="138" cy="194" rx="15" ry="11" fill="url(#ap-body)" stroke="#1b2447" stroke-width="2.5"/>
  <ellipse cx="102" cy="196" rx="8" ry="5" fill="url(#ap-belly)"/>
  <ellipse cx="138" cy="196" rx="8" ry="5" fill="url(#ap-belly)"/>
  <!-- bras -->
